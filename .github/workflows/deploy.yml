name: Deploy DM Automações

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            # Ajustá esta ruta al directorio donde tenés clonado el repo en tu VPS
            cd /var/www/dmautomacoes
            
            # Trae los últimos cambios
            git pull origin main
            
            # Opcional: si usás Docker para servir la web y necesitás reiniciar
            # docker compose restart
